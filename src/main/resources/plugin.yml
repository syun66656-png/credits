# 비밀정원(마인팜 네트워크) 크레딧 플러그인
# ※ Bukkit 은 플러그인 name 에 한글(비ASCII)을 허용하지 않는다([A-Za-z0-9 _.-] 만 가능).
#   그래서 name 은 영어 Credit 로 둔다. 한글 브랜딩은 그대로 유지된다:
#     - 우리 커스텀 색상 콘솔 로그: "크레딧 - MariaDB 연결 성공" (ConsoleLog 가 찍는 문구)
#     - 인게임 명령어: /크레딧
#     - 플레이어 메세지: messages.yml (한글)
#   Paper 자체가 찍는 플러그인 목록/로그 접두어([Credit])만 영어로 나온다.
name: Credit
version: 1.0.0
main: kr.scfarm.credit.CreditPlugin
# Paper 26.x 호환 표기. api-version 은 Bukkit 호환 계약 표기이며 서버 빌드 버전과 별개다.
api-version: '1.21'
author: 마인팜
description: 크레딧(캐시성 포인트) — MariaDB 단일 진실원, 전 연산 비동기, 홈페이지 결제 브릿지

# 런타임 라이브러리: shade 하지 않고 서버가 Maven Central 에서 내려받는다(명세 1번).
libraries:
  - com.zaxxer:HikariCP:6.2.1
  - org.mariadb.jdbc:mariadb-java-client:3.5.2
  # Redis(교차서버 캐시 무효화 + 지급 알림 브로드캐스트). config.yml 의 redis.enabled=true 로 켠다.
  # 사용하지 않을 서버에서는 이 줄을 지워도 되지만, 남겨둬도 redis.enabled=false 면 로드만 하고 쓰지 않는다.
  - io.lettuce:lettuce-core:6.5.5.RELEASE

softdepend:
  - PlaceholderAPI

commands:
  크레딧:
    description: 크레딧 잔액 확인 및 관리
    usage: /크레딧

permissions:
  credit.use:
    description: 본인 크레딧 잔액 확인
    default: true
  credit.admin:
    description: 크레딧 관리(확인/지급/차감/인증)
    default: op
