# ============================================================
#  플레이어 표시 문구 — 여기서 자유롭게 수정 가능(리로드/재시작 시 반영)
#
#  ▶ MiniMessage: <gold> <gradient:#a:#b> <hover:show_text:'...'> <click> 등 전체 태그
#  ▶ 내부 플레이스홀더: <amount>(콤마 포맷), <suffix>, <player>(닉네임), <uuid>
#  ▶ PlaceholderAPI: %player_name% %credit_balance% 등 %...% 도 동작
#      (PlaceholderAPI 설치 시. 메세지를 "보는 플레이어" 기준 해석)
#  ▶ Nexo (설치 시): <glyph:info>, <shift:-2> 등 Nexo 태그가 그대로 동작한다.
#      Nexo 가 있으면 메세지를 Nexo MiniMessage 로 파싱하므로 아래 glyphs 섹션(자체 <glyph>)은
#      사용되지 않는다(Nexo 글리프가 우선). Nexo 가 없을 때만 아래 glyphs 섹션의 <glyph:이름> 이 쓰인다.
# ============================================================

balance-self:      "<gray>보유 크레딧: </gray><gold><amount></gold><gray><suffix></gray>"
balance-other:     "<gray><player> 님의 크레딧: </gray><gold><amount></gold><gray><suffix></gray>"
# 지급/차감 확인. <uuid> 는 실제로 반영된 계정 — 닉변/동명이인 오지급을 즉시 알아채기 위해 표시한다.
give-success:      "<green><player> 님에게 <amount><suffix> 지급 완료 <gray>(<uuid>)</gray></green>"
take-success:      "<green><player> 님에게서 <amount><suffix> 차감 완료 <gray>(<uuid>)</gray></green>"
take-insufficient: "<red>잔액이 부족합니다.</red>"
# 자동충전 지급 알림(온라인 유저에게). <player>=지급 대상, <amount>/<suffix>=금액. %...% 도 사용 가능.
charge-received:   "<green><player> 님, 홈페이지 충전 </green><gold><amount></gold><green><suffix>이 지급되었습니다.</green>"
verify-result:     "<gray>UUID <white><uuid></white> → 닉네임: </gray><yellow><player></yellow>"
verify-notfound:   "<red>해당 UUID의 닉네임을 찾을 수 없습니다.</red>"
player-not-found:  "<red>대상 플레이어를 찾을 수 없습니다.</red>"
invalid-amount:    "<red>금액은 1 이상 1조 이하의 정수여야 합니다.</red>"
invalid-uuid:      "<red>올바른 UUID 형식이 아닙니다.</red>"
no-permission:     "<red>권한이 없습니다.</red>"
player-only:       "<red>플레이어만 사용할 수 있습니다.</red>"
db-error:          "<red>처리 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.</red>"
# 일반 유저가 관리자 서브명령어를 쳤을 때 — "권한 없음" 대신 없는 명령어처럼 처리(기능 존재 비노출).
# 완전히 조용히(아무 문구 없이) 처리하려면 값을 "" 로 비워도 된다.
unknown-command:   "<red>알 수 없는 명령어입니다. <gray>/help 로 도움말을 확인하세요.</gray></red>"
reload-success:    "<green>크레딧 설정과 메세지를 다시 불러왔습니다.</green>"
reload-failed:     "<red>리로드 중 오류가 발생했습니다. 콘솔 로그를 확인하세요.</red>"

# 관리자 전용 사용법(일반 유저는 서브명령어 자체가 '없는 명령어'로 처리된다)
usage-admin: |-
  <gray>─── 크레딧 관리 ───</gray>
  <gray>/크레딧 <white>— 본인 잔액</white></gray>
  <gray>/크레딧 확인 <white><닉네임></white></gray>
  <gray>/크레딧 지급 <white><닉네임> <금액></white></gray>
  <gray>/크레딧 차감 <white><닉네임> <금액></white></gray>
  <gray>/크레딧 인증 <white><uuid></white></gray>
  <gray>/크레딧 리로드 <white>— 설정/메세지 다시 불러오기</white></gray>

# 자체 커스텀 글리프(비트맵 폰트) 태그 매핑. <glyph:coin> 처럼 사용.
# ※ Nexo 가 설치돼 있으면 이 섹션은 무시되고 Nexo 글리프가 <glyph:...> 를 처리한다.
#   Nexo 없이 자체 글리프를 쓸 때만 유효. name: "문자[|폰트키]" (폰트키 생략 시 default).
glyphs:
  coin: ""
