# ============================================================
#  크레딧 플러그인 설정
#  - 잔액의 단일 진실원(source of truth)은 MariaDB 이다.
#  - MariaDB 연결 실패 시 플러그인은 스스로 비활성화된다(깨진 DB 쓰기 방지).
# ============================================================

database:
  host: "127.0.0.1"
  port: 3306
  name: "credit"
  user: "root"
  password: ""
  # HikariCP 최대 커넥션 수. 비동기 크레딧 연산 스레드 풀 크기도 이 값에 맞춘다.
  pool-size: 10

homepage:
  # 홈페이지 결제 브릿지. 오프라인/미접속 UUID 도 지급된다(UUID 기반 DB UPSERT).
  #
  # ★ 벨로시티 다중 백엔드 주의 ★
  #   브릿지 폴링은 "네트워크 전체에서 딱 한 서버"에서만 켠다(bridge-enabled: true).
  #   나머지 백엔드는 bridge-enabled: false 로 두어라 — 크레딧 지급/조회/명령어는 그대로 동작하고,
  #   폴링(홈페이지 API 호출)과 [크레딧 자동충전] 감사 로그만 그 한 서버에 모인다.
  #   (지급은 charge_id PK 멱등이라 여러 서버가 켜져도 중복 지급은 없지만, 로그가 흩어지고 폴링이 낭비된다.)
  #   안전을 위해 기본값은 false 다. 폴링할 서버 1대에서만 true 로 바꾼다.
  #   base-url 은 반드시 https 여야 하며(평문 전송 방지) 리다이렉트되지 않는 최종 주소여야 한다.
  bridge-enabled: false
  base-url: "https://scfarm.kr"
  # 홈페이지 운영자에게 받은 비밀키. 절대 로그/채팅에 노출하지 않는다.
  plugin-key: "여기에_PLUGIN_API_KEY"
  # 대기 중 결제 폴링 주기(초). 0 이하이면 브릿지를 끈다.
  poll-interval-seconds: 60
  # 지급 로그를 플러그인 폴더(plugins/Credit/charge-logs/charges-YYYY-MM.yml)에도 남긴다.
  # 실제 지급이 일어나는 브릿지 서버에서만 기록된다(DB/서버로그에 더한 사람이 읽기 쉬운 보조 기록).
  charge-log-file: true

display:
  # 잔액 뒤 접미사. 잔액의 단위는 크레딧이다(홈페이지 충전 비율 1,000원 = 1크레딧).
  # "원" 으로 두면 50크레딧이 "50원" 으로 보여 오해를 부른다.
  suffix: "크레딧"
  # 3자리마다 콤마
  thousands-separator: true

cache:
  # 온라인 유저 placeholder 캐시를 이 주기(초)로 일괄 갱신한다(배치 쿼리 1회, 비동기).
  # 다른 서버에서 바뀐 잔액도 이 주기로 따라잡힌다(Redis 없이도). 0 이하 = 끔.
  # 잔액의 진실원은 항상 DB 이며 /크레딧 명령어는 캐시를 쓰지 않는다.
  refresh-seconds: 30

redis:
  # 교차서버 Pub/Sub(선택). 두 가지에 쓰인다:
  #   1) 잔액 변경 시 다른 서버 placeholder 캐시 무효화
  #   2) 자동충전 지급 알림을 전 백엔드로 브로드캐스트 → 유저가 접속한 서버가 인게임 알림 전달
  #      (브릿지 서버가 1대여도 유저가 어느 백엔드에 있든 알림 도달. 플러그인 없는 hub 는 자동 제외)
  # 끄면: 캐시 없이 DB 조회로 폴백 + 알림은 브릿지 서버 접속자에게만.
  # ※ 네트워크의 모든 크레딧 서버(main/sub1/sub2/minigame)가 같은 Redis 를 바라보게 설정할 것.
  enabled: false
  host: "127.0.0.1"
  port: 6379
  # 비밀번호가 없으면 빈 문자열
  password: ""
  # 잔액 변경(캐시 무효화) 브로드캐스트 채널
  channel: "credit:invalidate"
  # 자동충전 지급 알림 브로드캐스트 채널
  notify-channel: "credit:notify"
